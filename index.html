<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Caveat:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root {
    --felt-deep: #061d14;
    --felt: #0d3625;
    --felt-light: #174c35;
    --parchment: #f2e5c3;
    --parchment-2: #e6d5a8;
    --parchment-edge: #c9b889;
    --ink: #1a1410;
    --ink-2: #4a3a24;
    --ink-light: #6b5a42;
    --gold: #c9a961;
    --gold-bright: #e8c671;
    --gold-deep: #8f7436;
    --ruby: #8b2936;
    --line: rgba(26, 20, 16, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Serif', Georgia, serif;
    color: var(--parchment);
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% -10%, var(--felt-light) 0%, var(--felt) 38%, var(--felt-deep) 95%),
      var(--felt-deep);
    padding: 2.5rem 1rem 5rem;
    position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.018) 1px, transparent 0);
    background-size: 4px 4px;
  }

  .container { max-width: 1080px; margin: 0 auto; position: relative; z-index: 1; }

  .hero { text-align: center; margin-bottom: 1.5rem; }
  .crest {
    font-size: 2.75rem; color: var(--gold); line-height: 1;
    margin-bottom: 0.75rem; letter-spacing: 0.35em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  .crest .small { font-size: 1.5rem; opacity: 0.55; vertical-align: 0.35em; margin: 0 0.2em; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500; font-style: italic;
    font-size: clamp(2.25rem, 5.5vw, 3.75rem);
    letter-spacing: 0.005em; line-height: 1.05; color: var(--parchment);
  }
  .subtitle {
    font-family: 'Caveat', cursive; font-size: 1.35rem;
    color: var(--gold); margin-top: 0.5rem; letter-spacing: 0.02em;
  }

  .live-strip {
    display: flex; justify-content: center; align-items: center; gap: 0.75rem;
    margin: 1.25rem 0 1.75rem; flex-wrap: wrap;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(242, 229, 195, 0.55);
  }
  .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 10px rgba(74, 222, 128, 0.7);
    animation: pulse 2s ease-in-out infinite; margin-right: 0.35rem;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.85); }
  }
  .live-strip .sep { opacity: 0.3; }

  .tabs {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 0; margin-bottom: 1.5rem;
    border-bottom: 1px solid rgba(201, 169, 97, 0.22);
  }
  .tab {
    background: none; border: none; color: var(--parchment);
    opacity: 0.5; padding: 0.85rem 1.3rem; cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    position: relative; transition: opacity 0.2s ease;
  }
  .tab:hover { opacity: 0.85; }
  .tab.active { opacity: 1; color: var(--gold-bright); }
  .tab.active::after {
    content: ''; position: absolute; bottom: -1px; left: 50%;
    transform: translateX(-50%); width: 55%; height: 2px; background: var(--gold);
  }

  .card {
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
    color: var(--ink); padding: 2.5rem 2rem; border-radius: 4px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.45),
      0 6px 16px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.4);
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(201, 169, 97, 0.1) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(139, 41, 54, 0.05) 0%, transparent 55%);
    pointer-events: none;
  }
  .card::after {
    content: ''; position: absolute; inset: 7px;
    border: 1px solid rgba(201, 169, 97, 0.28); border-radius: 2px; pointer-events: none;
  }
  .card-inner { position: relative; z-index: 1; }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.75rem; font-style: italic; font-weight: 500;
    color: var(--ink); margin-bottom: 0.1rem;
  }
  .section-subtitle {
    font-family: 'Caveat', cursive; font-size: 1.15rem;
    color: var(--ink-light); margin-bottom: 1.5rem;
  }

  table.board { width: 100%; border-collapse: collapse; }
  .board th {
    text-align: left; padding: 0.7rem 0.5rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-2); border-bottom: 1.5px solid var(--line);
  }
  .board th.num, .board td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .board tbody tr {
    border-bottom: 1px solid rgba(26, 20, 16, 0.08);
    transition: background 0.15s ease;
  }
  .board tbody tr:hover { background: rgba(201, 169, 97, 0.1); }
  .board td { padding: 0.8rem 0.5rem; font-size: 1rem; }
  .rank {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-weight: 600; font-style: italic;
    color: var(--ink-light); width: 2.5rem;
  }
  .rank-1 { color: var(--gold-deep); font-weight: 700; }
  .player-name { font-weight: 500; font-size: 1.05rem; color: var(--ink); }
  .record { font-family: 'Caveat', cursive; font-size: 1.3rem; color: var(--ink-2); }
  .winpct {
    font-family: 'Caveat', cursive; font-size: 1.55rem; font-weight: 700; color: var(--ink-2);
  }
  .winpct.leader { color: var(--gold-deep); }
  .winpct.perfect { color: var(--ruby); }
  .diff { font-variant-numeric: tabular-nums; font-weight: 500; font-size: 0.95rem; }
  .diff.pos { color: #2a5d3f; }
  .diff.neg { color: var(--ruby); }

  .awaiting {
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px dashed rgba(26, 20, 16, 0.22);
  }
  .awaiting-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 500;
    font-size: 1.05rem; color: var(--ink-light);
    letter-spacing: 0.08em; margin-bottom: 0.4rem;
  }
  .awaiting-names {
    font-family: 'Caveat', cursive;
    font-size: 1.4rem; color: var(--ink-2);
    line-height: 1.5;
  }
  .awaiting-names .dot { color: var(--gold-deep); opacity: 0.55; margin: 0 0.25em; }

  /* Standings — stacked row layout (mobile-friendly, works anywhere) */
  .standings { display: flex; flex-direction: column; }
  .standings-row {
    display: grid;
    grid-template-columns: 2.25rem 1fr auto;
    gap: 0.85rem; align-items: center;
    padding: 0.85rem 0.35rem;
    border-bottom: 1px solid rgba(26, 20, 16, 0.08);
    transition: background 0.15s ease;
  }
  .standings-row:hover { background: rgba(201, 169, 97, 0.08); }
  .standings-rank {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem; font-style: italic; font-weight: 600;
    color: var(--ink-light); text-align: center; line-height: 1;
  }
  .standings-rank.rank-1 { color: var(--gold-deep); font-weight: 700; }
  .standings-main { min-width: 0; }
  .standings-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem; font-weight: 500; color: var(--ink);
    line-height: 1.15; margin-bottom: 0.12rem;
  }
  .standings-meta {
    font-family: 'Caveat', cursive;
    font-size: 1.05rem; color: var(--ink-light);
    line-height: 1.25;
  }
  .standings-meta .diff-pos { color: #2a5d3f; font-weight: 600; }
  .standings-meta .diff-neg { color: var(--ruby); font-weight: 600; }
  .standings-pct {
    font-family: 'Caveat', cursive;
    font-size: 1.75rem; font-weight: 700;
    color: var(--ink-2); min-width: 3rem;
    text-align: right; line-height: 1;
  }
  .standings-pct.leader { color: var(--gold-deep); }
  .standings-pct.perfect { color: var(--ruby); }

  /* Champion strip — the leader of the pack */
  .champion-strip {
    position: relative;
    margin-bottom: 1.75rem;
    padding: 1.1rem 1.5rem 1.1rem 2.75rem;
    background: linear-gradient(135deg, rgba(201, 169, 97, 0.22) 0%, rgba(201, 169, 97, 0.06) 100%);
    border: 1px solid rgba(201, 169, 97, 0.5);
    border-radius: 3px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; flex-wrap: wrap;
  }
  .champion-strip::before {
    content: '♛'; position: absolute;
    top: 50%; left: 1rem; transform: translateY(-50%);
    font-size: 1.4rem; color: var(--gold-deep);
  }
  .champion-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-light); margin-bottom: 0.25rem;
  }
  .champion-name {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 600;
    font-size: 1.65rem; color: var(--ink); line-height: 1;
  }
  .champion-ties {
    font-family: 'Caveat', cursive;
    font-size: 1rem; color: var(--ink-light); margin-top: 0.2rem;
  }
  .champion-stat {
    font-family: 'Caveat', cursive;
    font-size: 1.5rem; font-weight: 700; color: var(--ink-2);
  }

  /* Rivalries */
  .rivalry-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    gap: 1rem; align-items: center;
    padding: 0.85rem 0.5rem;
    border-bottom: 1px solid rgba(26, 20, 16, 0.08);
    transition: background 0.15s ease;
  }
  .rivalry-row:hover { background: rgba(201, 169, 97, 0.1); }
  .rivalry-player {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; font-weight: 500; color: var(--ink);
  }
  .rivalry-player.p-left { text-align: right; }
  .rivalry-score {
    font-family: 'Caveat', cursive;
    font-size: 1.7rem; font-weight: 700;
    min-width: 5rem;
    display: flex; align-items: center; justify-content: center; gap: 0.35rem;
    color: var(--ink-2);
  }
  .rivalry-score .leading { color: var(--gold-deep); }
  .rivalry-score .dash { color: var(--ink-light); opacity: 0.45; font-weight: 400; }
  .rivalry-games {
    font-family: 'Caveat', cursive;
    font-size: 1.05rem; color: var(--ink-light);
    text-align: right; white-space: nowrap;
  }

  /* Hall of Fame */
  .hof-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
  }
  .hof-card {
    padding: 1.2rem 1.25rem;
    background: rgba(255, 253, 245, 0.55);
    border: 1px solid rgba(26, 20, 16, 0.12);
    border-radius: 4px;
    cursor: pointer; position: relative; overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .hof-card:hover {
    transform: translateY(-2px);
    border-color: rgba(201, 169, 97, 0.65);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.15);
  }
  .hof-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-deep) 100%);
  }
  .hof-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-light); margin-bottom: 0.5rem;
  }
  .hof-value {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-weight: 600;
    font-size: 1.8rem; color: var(--ink);
    line-height: 1; margin-bottom: 0.55rem;
  }
  .hof-holder {
    font-family: 'Caveat', cursive;
    font-size: 1.35rem; color: var(--ink-2); line-height: 1.3;
  }
  .hof-date {
    font-family: 'IBM Plex Serif', serif;
    font-size: 0.78rem; color: var(--ink-light);
    margin-top: 0.6rem; font-style: italic;
  }
  .hof-jump {
    font-family: 'Caveat', cursive;
    font-size: 0.95rem; color: var(--gold-deep);
    margin-top: 0.25rem; opacity: 0.65;
  }

  /* Game spotlight when jumped to from HOF */
  .game-card.spotlight {
    animation: spotlight 2.2s ease;
  }
  @keyframes spotlight {
    0%   { box-shadow: 0 0 0 0 rgba(201, 169, 97, 0); }
    20%  { box-shadow: 0 0 0 4px rgba(201, 169, 97, 0.75); }
    100% { box-shadow: 0 0 0 0 rgba(201, 169, 97, 0); }
  }

  .empty {
    text-align: center; padding: 3rem 1rem;
    font-family: 'Caveat', cursive; font-size: 1.6rem; color: var(--ink-light);
  }
  .empty .spade { font-size: 3rem; display: block; margin-bottom: 0.5rem; color: var(--gold-deep); font-family: 'IBM Plex Serif', serif; }

  .game-list { display: flex; flex-direction: column; gap: 1.25rem; }
  .game-card {
    background: rgba(255, 253, 245, 0.5);
    border: 1px solid rgba(26, 20, 16, 0.12);
    border-radius: 4px; padding: 1.1rem 1.25rem;
    position: relative;
  }
  .game-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 0.9rem;
    font-family: 'Caveat', cursive; color: var(--ink-light); font-size: 1.1rem;
  }
  .game-teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center; }
  .team { padding: 0.75rem 1rem; border-radius: 3px; }

  .game-commentary {
    margin-top: 1rem; padding: 0.75rem 0.25rem 0;
    border-top: 1px dashed rgba(26, 20, 16, 0.2);
    font-family: 'Caveat', cursive;
    font-size: 1.3rem; line-height: 1.4;
    color: var(--ink-2);
    display: flex; gap: 0.6rem; align-items: flex-start;
  }
  .game-commentary::before {
    content: '"'; font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem; font-style: italic; line-height: 0.5;
    color: var(--gold-deep); flex-shrink: 0;
    padding-top: 0.65rem; opacity: 0.7;
  }

  .game-footer {
    margin-top: 0.9rem;
    display: flex; justify-content: flex-end;
  }
  .evidence-btn {
    background: none; border: none; cursor: pointer;
    font-family: 'Caveat', cursive; font-size: 1.1rem;
    color: var(--gold-deep); padding: 0.3rem 0.5rem;
    letter-spacing: 0.02em;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .evidence-btn:hover { color: var(--ruby); transform: translateY(-1px); }
  .evidence-btn::before { content: '📷 '; font-family: 'IBM Plex Serif', serif; margin-right: 0.2rem; }

  /* Modal / lightbox for the full screenshot */
  .modal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(6, 29, 20, 0.92);
    display: none; align-items: center; justify-content: center;
    padding: 2rem 1rem; cursor: zoom-out;
    backdrop-filter: blur(6px);
  }
  .modal.open { display: flex; animation: fadein 0.2s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal-inner {
    max-width: 95vw; max-height: 90vh;
    display: flex; flex-direction: column; align-items: center; gap: 1rem;
    cursor: default;
  }
  .modal-inner img {
    max-width: 100%; max-height: 80vh;
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(201, 169, 97, 0.3);
  }
  .modal-caption {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 1.1rem; color: var(--parchment); opacity: 0.75;
  }
  .modal-close {
    position: absolute; top: 1.5rem; right: 1.5rem;
    background: none; border: 1px solid rgba(242, 229, 195, 0.4);
    color: var(--parchment); width: 2.5rem; height: 2.5rem;
    border-radius: 50%; font-size: 1.2rem; cursor: pointer;
    transition: background 0.15s ease;
  }
  .modal-close:hover { background: rgba(242, 229, 195, 0.15); }
  .team-names {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; font-weight: 500; color: var(--ink);
    margin-bottom: 0.35rem; line-height: 1.3;
  }
  .team-score {
    font-family: 'Caveat', cursive; font-size: 2.25rem;
    font-weight: 700; color: var(--ink); line-height: 1;
  }
  .team.won { position: relative; }
  .team.won .team-score {
    color: var(--ink); position: relative; display: inline-block;
    padding: 0 0.3em;
  }
  .team.won .team-score::before {
    content: ''; position: absolute; inset: -0.15em -0.15em;
    border: 2.5px solid var(--ruby); border-radius: 50%;
    transform: rotate(-3deg); pointer-events: none;
  }
  .vs {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 1.2rem; color: var(--ink-light); text-align: center;
  }

  .footer-note {
    text-align: center; margin-top: 2rem;
    font-family: 'Caveat', cursive; font-size: 1.15rem;
    color: rgba(201, 169, 97, 0.65); letter-spacing: 0.02em;
  }

  @media (max-width: 640px) {
    .game-teams { grid-template-columns: 1fr; gap: 0.5rem; }
    .vs { display: none; }
    .card { padding: 1.75rem 1.1rem; }
    .live-strip { font-size: 0.75rem; letter-spacing: 0.15em; gap: 0.5rem; }

    .standings-row { gap: 0.6rem; padding: 0.8rem 0.2rem; grid-template-columns: 2rem 1fr auto; }
    .standings-name { font-size: 1.1rem; }
    .standings-meta { font-size: 0.95rem; }
    .standings-pct { font-size: 1.55rem; min-width: 2.75rem; }

    .champion-strip { padding: 1rem 1.25rem 1rem 2.4rem; }
    .champion-name { font-size: 1.4rem; }
    .champion-stat { font-size: 1.3rem; }

    .rivalry-row {
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto;
      row-gap: 0.2rem; gap: 0.75rem;
      padding: 0.85rem 0.25rem;
    }
    .rivalry-games {
      grid-column: 1 / -1;
      text-align: center; font-size: 0.9rem; opacity: 0.7;
    }
    .rivalry-player { font-size: 1rem; }
    .rivalry-score { font-size: 1.4rem; min-width: 3.25rem; }

    .hof-value { font-size: 1.55rem; }
    .section-title { font-size: 1.5rem; }
  }
</style>

<div class="container">
  <header class="hero">
    <div class="crest">♠<span class="small">♦</span>♠<span class="small">♣</span>♠</div>
    <h1>The Spades Tournament</h1>
    <div class="subtitle">who's running it, who's folding</div>
  </header>

  <div class="live-strip">
    <span><span class="live-dot"></span>Live</span>
    <span class="sep">·</span>
    <span id="rosterCount">7 players</span>
    <span class="sep">·</span>
    <span id="gameCount">1 game logged</span>
    <span class="sep">·</span>
    <span id="lastUpdate">Updated —</span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="players">Players</button>
    <button class="tab" data-tab="duos">Duos</button>
    <button class="tab" data-tab="rivalries">Rivalries</button>
    <button class="tab" data-tab="games">Games</button>
    <button class="tab" data-tab="hof">Hall of Fame</button>
  </nav>

  <div class="card">
    <div class="card-inner" id="view"></div>
  </div>

  <div class="footer-note">scorekeeping by Claude · drop a screenshot in chat to log the next game</div>
</div>

<div class="modal" id="modal">
  <button class="modal-close" id="modalClose" title="Close">✕</button>
  <div class="modal-inner" onclick="event.stopPropagation()">
    <img id="modalImg" alt="Game scoresheet" />
    <div class="modal-caption" id="modalCaption"></div>
  </div>
</div>

<script>
  // ========================================================================
  // TOURNAMENT DATA — maintained by Claude. When a new game screenshot is
  // dropped in chat, Claude appends to this array and bumps LAST_UPDATED.
  // ========================================================================
  const GAMES = [
    {
      id: 'g001',
      date: '2026-04-20T14:55:00-04:00',
      team1: { players: ['Gerald', 'Juanito'], score: 518, bags: 8 },
      team2: { players: ['Jr', 'Von Da Juiceman'], score: 394, bags: 4 },
      events: [
        { type: 'bid-made', team: 'team1', bid: 8 },
        { type: 'bag-penalty', team: 'team2' }

  // LAST_UPDATED auto-derives from the most recent game's date
  const LAST_UPDATED = GAMES.length
    ? GAMES.reduce((latest, g) => new Date(g.date) > new Date(latest) ? g.date : latest, GAMES[0].date)
    : new Date().toISOString();

  // The full tournament roster. Players who appear in GAMES show up in the
  // live standings; roster names not yet in any game show as "Awaiting Debut."
  const ROSTER = ['Gerald', 'Juanito', 'Jr', 'Von Da Juiceman', 'Clifton', 'Rasheed', 'Sergio'];
  // ========================================================================

  let currentTab = 'players';

  const norm = s => (s || '').trim().toLowerCase();
  function winnerOf(g) { return g.team1.score > g.team2.score ? 'team1' : 'team2'; }

  function playerStats(gms) {
    const map = {};
    gms.forEach(g => {
      const w = winnerOf(g), l = w === 'team1' ? 'team2' : 'team1';
      g[w].players.forEach(n => {
        const k = norm(n); if (!map[k]) map[k] = { name: n, wins: 0, losses: 0, pf: 0, pa: 0 };
        map[k].name = n; map[k].wins++; map[k].pf += g[w].score; map[k].pa += g[l].score;
      });
      g[l].players.forEach(n => {
        const k = norm(n); if (!map[k]) map[k] = { name: n, wins: 0, losses: 0, pf: 0, pa: 0 };
        map[k].name = n; map[k].losses++; map[k].pf += g[l].score; map[k].pa += g[w].score;
      });
    });
    return Object.values(map).map(p => {
      const games = p.wins + p.losses;
      return { ...p, games, winPct: games ? p.wins / games : 0, diff: p.pf - p.pa };
    }).sort((a, b) => b.winPct - a.winPct || b.wins - a.wins || b.diff - a.diff);
  }

  function duoStats(gms) {
    const map = {};
    gms.forEach(g => {
      [g.team1, g.team2].forEach(t => {
        const won = t === (winnerOf(g) === 'team1' ? g.team1 : g.team2);
        const key = t.players.map(norm).sort().join('|');
        if (!map[key]) map[key] = { players: [...t.players].sort((a,b)=>a.localeCompare(b)), wins: 0, losses: 0 };
        if (won) map[key].wins++; else map[key].losses++;
      });
    });
    return Object.values(map).map(d => {
      const g = d.wins + d.losses;
      return { ...d, games: g, winPct: g ? d.wins / g : 0 };
    }).sort((a, b) => b.winPct - a.winPct || b.wins - a.wins);
  }

  // Head-to-head: each opposing player pair, tracked across all their meetings.
  function rivalryStats(gms) {
    const map = {};
    gms.forEach(g => {
      const winners = winnerOf(g) === 'team1' ? g.team1.players : g.team2.players;
      const losers  = winnerOf(g) === 'team1' ? g.team2.players : g.team1.players;
      winners.forEach(w => {
        losers.forEach(l => {
          const [a, b] = [w, l].sort((x, y) => norm(x).localeCompare(norm(y)));
          const key = norm(a) + '|' + norm(b);
          if (!map[key]) map[key] = { players: [a, b], aWins: 0, bWins: 0 };
          if (norm(a) === norm(w)) map[key].aWins++; else map[key].bWins++;
          map[key].players = [a, b];
        });
      });
    });
    return Object.values(map)
      .map(r => ({ ...r, games: r.aWins + r.bWins, gap: Math.abs(r.aWins - r.bWins) }))
      .sort((a, b) => b.games - a.games || b.gap - a.gap);
  }

  // Records for the Hall of Fame, computed from games + structured events.
  function computeRecords(gms) {
    if (gms.length === 0) return [];
    const records = [];
    const gameById = {};
    gms.forEach(g => gameById[g.id] = g);

    // Highest single-team score
    let hs = null;
    gms.forEach(g => [g.team1, g.team2].forEach(t => {
      if (!hs || t.score > hs.value) hs = { value: t.score, team: t, game: g };
    }));
    if (hs) records.push({
      title: 'Highest Score', value: `${hs.value} pts`,
      holder: hs.team.players.join(' & '), date: hs.game.date, gameId: hs.game.id
    });

    // Biggest margin of victory
    let bm = null;
    gms.forEach(g => {
      const margin = Math.abs(g.team1.score - g.team2.score);
      if (!bm || margin > bm.value) {
        const winner = winnerOf(g);
        bm = { value: margin, team: g[winner], game: g };
      }
    });
    if (bm) records.push({
      title: 'Biggest Blowout', value: `${bm.value} pts`,
      holder: bm.team.players.join(' & '), date: bm.game.date, gameId: bm.game.id
    });

    // Highest bid made (from events)
    let hb = null;
    gms.forEach(g => (g.events || []).forEach(e => {
      if (e.type === 'bid-made' && (!hb || e.bid > hb.value)) {
        hb = { value: e.bid, team: g[e.team], game: g };
      }
    }));
    if (hb) records.push({
      title: 'Highest Bid Made', value: `${hb.value} bid`,
      holder: hb.team.players.join(' & '), date: hb.game.date, gameId: hb.game.id
    });

    // Biggest Comeback — max deficit a winning team came back from
    let bc = null;
    gms.forEach(g => {
      const wKey = winnerOf(g);
      const winTeam = g[wKey];
      if (winTeam.comeback && (!bc || winTeam.comeback > bc.value)) {
        bc = { value: winTeam.comeback, team: winTeam, game: g };
      }
    });
    if (bc) records.push({
      title: 'Biggest Comeback', value: `from -${bc.value}`,
      holder: bc.team.players.join(' & '), date: bc.game.date, gameId: bc.game.id
    });

    // Longest individual win streak
    const sorted = [...gms].sort((a, b) => new Date(a.date) - new Date(b.date));
    const streaks = {};
    sorted.forEach(g => {
      const winners = winnerOf(g) === 'team1' ? g.team1.players : g.team2.players;
      const losers  = winnerOf(g) === 'team1' ? g.team2.players : g.team1.players;
      [...winners, ...losers].forEach(p => {
        const k = norm(p);
        if (!streaks[k]) streaks[k] = { name: p, current: 0, longest: 0, endGameId: null };
        streaks[k].name = p;
      });
      winners.forEach(p => {
        const k = norm(p);
        streaks[k].current++;
        if (streaks[k].current > streaks[k].longest) {
          streaks[k].longest = streaks[k].current;
          streaks[k].endGameId = g.id;
        }
      });
      losers.forEach(p => { streaks[norm(p)].current = 0; });
    });
    const maxStreak = Math.max(0, ...Object.values(streaks).map(s => s.longest));
    if (maxStreak > 0) {
      const tops = Object.values(streaks).filter(s => s.longest === maxStreak);
      records.push({
        title: 'Longest Win Streak',
        value: `${maxStreak} ${maxStreak === 1 ? 'win' : 'in a row'}`,
        holder: tops.map(t => t.name).join(' · '),
        date: gameById[tops[0].endGameId].date,
        gameId: tops[0].endGameId
      });
    }

    return records;
  }

  function renderRivalries() {
    const rivs = rivalryStats(GAMES);
    if (rivs.length === 0) return emptyState('no rivalries on record yet');
    const rows = rivs.map(r => {
      const aLead = r.aWins > r.bWins;
      const bLead = r.bWins > r.aWins;
      return `
        <div class="rivalry-row">
          <div class="rivalry-player p-left">${escapeHTML(r.players[0])}</div>
          <div class="rivalry-score">
            <span class="${aLead ? 'leading' : ''}">${r.aWins}</span>
            <span class="dash">–</span>
            <span class="${bLead ? 'leading' : ''}">${r.bWins}</span>
          </div>
          <div class="rivalry-player">${escapeHTML(r.players[1])}</div>
          <div class="rivalry-games">${r.games} ${r.games === 1 ? 'meeting' : 'meetings'}</div>
        </div>`;
    }).join('');
    return `
      <h2 class="section-title">Rivalries</h2>
      <p class="section-subtitle">head-to-head, you vs them — the scores that ride on eye contact</p>
      <div>${rows}</div>`;
  }

  function renderHallOfFame() {
    const records = computeRecords(GAMES);
    if (records.length === 0) return emptyState('no records yet — play a game');
    const cards = records.map(r => `
      <div class="hof-card" data-game-id="${r.gameId}" role="button" tabindex="0">
        <div class="hof-title">${escapeHTML(r.title)}</div>
        <div class="hof-value">${escapeHTML(r.value)}</div>
        <div class="hof-holder">${escapeHTML(r.holder)}</div>
        <div class="hof-date">${formatDate(r.date)}</div>
        <div class="hof-jump">→ view game</div>
      </div>`).join('');
    return `
      <h2 class="section-title">Hall of Fame</h2>
      <p class="section-subtitle">the records that'll get chased · click any card to jump to the game</p>
      <div class="hof-grid">${cards}</div>`;
  }

  function renderPlayers() {
    const stats = playerStats(GAMES);
    if (stats.length === 0) return emptyState('no players on the board yet');
    const rows = stats.map((p, i) => {
      const pct = (p.winPct * 100).toFixed(0);
      const leader = i === 0 && stats.length > 1;
      const perfect = p.winPct === 1 && p.games >= 2;
      const diffCls = p.diff >= 0 ? 'diff-pos' : 'diff-neg';
      const diffText = (p.diff >= 0 ? '+' : '') + p.diff;
      return `
        <div class="standings-row">
          <div class="standings-rank rank-${i+1}">${i+1}</div>
          <div class="standings-main">
            <div class="standings-name">${escapeHTML(p.name)}</div>
            <div class="standings-meta">${p.wins}–${p.losses} · ${p.games} ${p.games === 1 ? 'game' : 'games'} · <span class="${diffCls}">${diffText}</span> pt diff</div>
          </div>
          <div class="standings-pct ${leader ? 'leader' : ''} ${perfect ? 'perfect' : ''}">${pct}%</div>
        </div>`;
    }).join('');
    const playedSet = new Set(stats.map(s => norm(s.name)));
    const awaiting = ROSTER.filter(n => !playedSet.has(norm(n)));
    const awaitingHTML = awaiting.length ? `
      <div class="awaiting">
        <h3 class="awaiting-title">Awaiting Debut</h3>
        <div class="awaiting-names">${awaiting.map(escapeHTML).join(' <span class="dot">·</span> ')}</div>
      </div>` : '';

    // Current leader callout — individual win % is the tournament's north star
    const top = stats[0];
    const coLeaders = top ? stats.filter(p =>
      p.winPct === top.winPct && p.wins === top.wins && p.diff === top.diff
    ) : [];
    const championHTML = top && top.games > 0 ? `
      <div class="champion-strip">
        <div>
          <div class="champion-label">Current Leader${coLeaders.length > 1 ? 's' : ''}</div>
          <div class="champion-name">${coLeaders.map(p => escapeHTML(p.name)).join(' &amp; ')}</div>
          ${coLeaders.length > 1 ? `<div class="champion-ties">co-leaders · tied on record &amp; point diff</div>` : ''}
        </div>
        <div class="champion-stat">${(top.winPct * 100).toFixed(0)}% · ${top.wins}–${top.losses}</div>
      </div>` : '';

    return `
      ${championHTML}
      <h2 class="section-title">Standings</h2>
      <p class="section-subtitle">win % is the tiebreaker for the pot</p>
      <div class="standings">${rows}</div>
      ${awaitingHTML}`;
  }

  function renderDuos() {
    const stats = duoStats(GAMES);
    if (stats.length === 0) return emptyState('no partnerships on record yet');
    const rows = stats.map((d, i) => {
      const pct = (d.winPct * 100).toFixed(0);
      const leader = i === 0 && stats.length > 1;
      return `
        <div class="standings-row">
          <div class="standings-rank rank-${i+1}">${i+1}</div>
          <div class="standings-main">
            <div class="standings-name">${d.players.map(escapeHTML).join(' &amp; ')}</div>
            <div class="standings-meta">${d.wins}–${d.losses} · ${d.games} ${d.games === 1 ? 'game' : 'games'} together</div>
          </div>
          <div class="standings-pct ${leader ? 'leader' : ''}">${pct}%</div>
        </div>`;
    }).join('');
    return `
      <h2 class="section-title">Partnerships</h2>
      <p class="section-subtitle">who clicks, who curses each other out</p>
      <div class="standings">${rows}</div>`;
  }

  function renderGames() {
    if (GAMES.length === 0) return emptyState('no games logged yet');
    const sorted = [...GAMES].sort((a, b) => new Date(b.date) - new Date(a.date));
    const cards = sorted.map(g => {
      const w = winnerOf(g);
      const t1won = w === 'team1', t2won = w === 'team2';
      const margin = Math.abs(g.team1.score - g.team2.score);
      const dateStr = formatDate(g.date);
      const commentaryHTML = g.commentary ? `
          <div class="game-commentary">${escapeHTML(g.commentary)}</div>` : '';
      const evidenceHTML = g.screenshot ? `
          <div class="game-footer">
            <button class="evidence-btn" data-game="${g.id}">view scoresheet</button>
          </div>` : '';
      return `
        <div class="game-card" data-game-card="${g.id}">
          <div class="game-head">
            <span>${dateStr}</span>
            <span>margin: ${margin}</span>
          </div>
          <div class="game-teams">
            <div class="team ${t1won ? 'won' : ''}">
              <div class="team-names">${g.team1.players.map(escapeHTML).join(' &amp; ')}</div>
              <div class="team-score">${g.team1.score}</div>
            </div>
            <div class="vs">vs.</div>
            <div class="team ${t2won ? 'won' : ''}">
              <div class="team-names">${g.team2.players.map(escapeHTML).join(' &amp; ')}</div>
              <div class="team-score">${g.team2.score}</div>
            </div>
          </div>
          ${commentaryHTML}
          ${evidenceHTML}
        </div>`;
    }).join('');
    return `
      <h2 class="section-title">Game Ledger</h2>
      <p class="section-subtitle">every hand that's been played</p>
      <div class="game-list">${cards}</div>`;
  }

  function emptyState(msg) {
    return `<div class="empty"><span class="spade">♠</span>${msg}</div>`;
  }

  function render() {
    const view = document.getElementById('view');
    view.innerHTML =
      currentTab === 'players'   ? renderPlayers() :
      currentTab === 'duos'      ? renderDuos() :
      currentTab === 'rivalries' ? renderRivalries() :
      currentTab === 'hof'       ? renderHallOfFame() :
                                   renderGames();
  }

  function updateTabs() {
    document.querySelectorAll('.tab').forEach(t =>
      t.classList.toggle('active', t.dataset.tab === currentTab)
    );
  }

  document.getElementById('tabs').addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (!t) return;
    currentTab = t.dataset.tab; updateTabs(); render();
  });

  // Evidence modal wiring (event delegation so it works after rerenders)
  document.addEventListener('click', e => {
    const btn = e.target.closest('.evidence-btn');
    if (btn) {
      const g = GAMES.find(x => x.id === btn.dataset.game);
      if (g && g.screenshot) openModal(g);
      return;
    }
    const hofCard = e.target.closest('.hof-card');
    if (hofCard) {
      goToGame(hofCard.dataset.gameId);
    }
  });
  document.addEventListener('keydown', e => {
    const hofCard = document.activeElement && document.activeElement.closest?.('.hof-card');
    if (hofCard && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      goToGame(hofCard.dataset.gameId);
    }
  });

  function goToGame(gameId) {
    currentTab = 'games';
    updateTabs();
    render();
    setTimeout(() => {
      const el = document.querySelector(`[data-game-card="${gameId}"]`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('spotlight');
        setTimeout(() => el.classList.remove('spotlight'), 2200);
      }
    }, 80);
  }
  document.getElementById('modal').addEventListener('click', closeModal);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function openModal(game) {
    const modal = document.getElementById('modal');
    document.getElementById('modalImg').src = game.screenshot;
    const caption = `${game.team1.players.join(' & ')} vs ${game.team2.players.join(' & ')} · ${formatDate(game.date)}`;
    document.getElementById('modalCaption').textContent = caption;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
  }

  function formatDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    } catch (e) { return iso; }
  }
  function formatRelativeUpdate(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.round(diffMs / 60000);
    const diffHr  = Math.round(diffMs / 3600000);
    const diffDay = Math.round(diffMs / 86400000);
    if (diffMin < 2)      return 'Updated just now';
    if (diffMin < 60)     return `Updated ${diffMin} min ago`;
    if (diffHr  < 24)     return `Updated ${diffHr} hr ago`;
    if (diffDay < 7)      return `Updated ${diffDay} day${diffDay === 1 ? '' : 's'} ago`;
    return `Updated ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
  }
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
    );
  }

  document.getElementById('rosterCount').textContent =
    `${ROSTER.length} player${ROSTER.length === 1 ? '' : 's'}`;
  document.getElementById('gameCount').textContent =
    `${GAMES.length} game${GAMES.length === 1 ? '' : 's'} logged`;
  document.getElementById('lastUpdate').textContent = formatRelativeUpdate(LAST_UPDATED);
  render();
</script>
